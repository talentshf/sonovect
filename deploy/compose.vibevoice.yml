# Reuses an operator-managed official VibeVoice vLLM service on a private network.
# Use a separate Compose project/data volume; never run different file backends
# against the same queue. No model or inference image is downloaded by this file.
name: sonovect-vibevoice
x-core: &core
  image: ${SONOVECT_IMAGE:?Set an image built from this candidate source}
  build: {context: .., target: core}
  env_file: ${SONOVECT_ENV_FILE:-.env}
  environment:
    SONOVECT_LAYOUT: external
    SONOVECT_BACKEND: vibevoice
    SONOVECT_DATA_DIR: /data
    SONOVECT_PROVIDER_URL: ${SONOVECT_PROVIDER_URL:?Set the private VibeVoice server root URL}
    SONOVECT_SOUND_ENABLED: 'false'
    SONOVECT_VOICE_ENABLED: 'false'
    SONOVECT_MEASUREMENTS_ENABLED: 'false'
  volumes: [jobs:/data]
  networks: [processing]
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options: {max-size: '10m', max-file: '3'}
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
services:
  api:
    <<: *core
    ports: ['${SONOVECT_BIND:-127.0.0.1}:${SONOVECT_PORT:-8098}:8096']
    healthcheck:
      test: [CMD, sonovect-health, api]
      interval: 20s
      timeout: 10s
      retries: 3
  worker:
    <<: *core
    image: ${SONOVECT_WORKER_IMAGE:?Set a media-worker image built from this candidate source}
    build: {context: .., target: media-worker}
    command: [sonovect-worker]
    stop_grace_period: 90s
    healthcheck:
      test: [CMD, sonovect-health, worker]
      interval: 30s
      timeout: 10s
      retries: 3
networks:
  processing:
    external: true
    name: ${SONOVECT_PROCESSING_NETWORK:-sonovect_default}
volumes:
  jobs:
