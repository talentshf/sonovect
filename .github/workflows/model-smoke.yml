name: native-model-smoke
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  native-funasr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure model cache
        run: echo "MODELSCOPE_CACHE=$RUNNER_TEMP/sonovect-models/modelscope" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - run: python -m pip install torch==2.14.1 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -c providers/speech/constraints.txt -r providers/speech/native-worker/requirements.lock
      - run: python -m pip install --no-deps .
      - run: sonovect models prepare paraformer fsmn punc cam
      - run: sonovect models verify paraformer fsmn punc cam
      - run: python scripts/model_smoke.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-model-smoke-result
          path: model-smoke-result.json
